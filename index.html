<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Now Just Relax — Race Night Live</title>
<style>
  :root{
    --bg-top:#111a2e; --bg-bot:#0a0e18; --lane:#232a3b; --lane-line:#3a4257;
    --accent:#FFB627; --accent2:#2EC4E8; --gold:#FFE9A8; --crimson:#E63950;
    --text:#E8ECF4; --muted:#7C8AA5; --panel:#0f1524;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; background:#05070c; overflow:hidden;
    font-family:"Helvetica Neue", Arial, sans-serif; color:var(--text);}
  #app{ position:relative; width:100vw; height:100vh; display:flex; align-items:center; justify-content:center; }

  #stage{
    position:relative; background:linear-gradient(180deg,var(--bg-top),var(--bg-bot));
    overflow:hidden; border-radius:14px; box-shadow:0 0 0 2px #000, 0 30px 80px rgba(0,0,0,.6);
    transition:background .6s ease;
  }
  #stage.aspect-v{ height:94vh; aspect-ratio:9/16; }
  #stage.aspect-h{ width:94vw; aspect-ratio:16/9; max-height:94vh; }

  canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }

  #stage.punch canvas{ animation:punch .3s ease; }
  @keyframes punch{ 0%{transform:scale(1);} 40%{transform:scale(1.035);} 100%{transform:scale(1);} }

  /* ---- top brand + ticker ---- */
  #brandRow{ position:absolute; top:0; left:0; right:0; padding:10px 12px 6px;
    display:flex; align-items:center; gap:8px; z-index:5;
    background:linear-gradient(180deg, rgba(0,0,0,.55), transparent); }
  #liveDot{ width:9px; height:9px; border-radius:50%; background:var(--crimson);
    box-shadow:0 0 8px var(--crimson); animation:blink 1.4s infinite; }
  @keyframes blink{ 50%{opacity:.25;} }
  #brand{ font-weight:800; letter-spacing:.06em; font-size:12px; text-transform:uppercase; color:#fff; }
  #brand span{ color:var(--accent); }

  #stageCountdown{ position:absolute; top:8px; right:12px; z-index:6;
    background:rgba(0,0,0,.45); border:1px solid rgba(255,255,255,.18); border-radius:20px;
    padding:4px 11px; font-family:"Courier New", monospace; font-weight:800; font-size:14px;
    color:var(--accent); letter-spacing:.03em; transition:color .2s ease, border-color .2s ease; }
  #stageCountdown.warn{ color:var(--crimson); border-color:var(--crimson); }

  #ticker{ position:absolute; top:30px; left:0; right:0; height:22px; overflow:hidden; z-index:5;
    background:rgba(0,0,0,.35); border-top:1px solid rgba(255,255,255,.06); border-bottom:1px solid rgba(255,255,255,.06); }
  #tickerTrack{ position:absolute; white-space:nowrap; font-size:12px; font-weight:600; color:var(--muted);
    letter-spacing:.02em; animation:scrollTicker 18s linear infinite; padding-left:100%; top:3px; }
  @keyframes scrollTicker{ from{ transform:translateX(0);} to{ transform:translateX(-100%);} }

  /* ---- phase label + commentary ---- */
  #phaseLabel{ position:absolute; top:60px; left:0; right:0; text-align:center; z-index:5;
    font-size:11px; font-weight:800; letter-spacing:.18em; text-transform:uppercase; color:var(--accent2); }
  #commentary{ position:absolute; top:80px; left:12px; right:12px; text-align:center; z-index:5;
    font-size:14px; font-weight:700; min-height:20px; color:#fff; text-shadow:0 2px 6px rgba(0,0,0,.6);
    transition:opacity .3s ease; }

  /* ---- signature tension / position bar ---- */
  #bottomStack{ position:absolute; left:14px; right:14px; bottom:14px; z-index:5;
    display:flex; flex-direction:column; gap:10px; }
  #tensionWrap{ position:relative; }
  #tensionMeter{ position:relative; height:10px; border-radius:6px; background:rgba(255,255,255,.08);
    overflow:visible; border:1px solid rgba(255,255,255,.12); }
  #tensionFill{ height:100%; width:0%; border-radius:6px; background:linear-gradient(90deg,var(--accent2),var(--accent));
    transition:width .1s linear, background .3s ease; }
  #tensionFill.locked{ background:var(--crimson); }
  .posDot{ position:absolute; top:-4px; width:18px; height:18px; border-radius:50%; border:2px solid #05070c;
    transform:translateX(-50%); transition:left .12s linear; display:flex; align-items:center; justify-content:center;
    font-size:9px; font-weight:800; color:#05070c; }
  #tensionCaption{ font-size:10px; color:var(--muted); text-align:center; margin-top:6px; letter-spacing:.08em; text-transform:uppercase; }

  /* ---- roster cards ---- */
  #roster{ position:relative;
    display:flex; gap:6px; justify-content:center; flex-wrap:wrap; }
  .rcard{ background:rgba(15,21,36,.85); border:1px solid rgba(255,255,255,.08); border-radius:10px;
    padding:6px 8px; min-width:64px; text-align:center; opacity:0; transform:translateY(14px);
    transition:opacity .4s ease, transform .4s ease; }
  .rcard.show{ opacity:1; transform:translateY(0); }
  .rswatch{ width:16px; height:16px; border-radius:50%; margin:0 auto 4px; }
  .rname{ font-size:10.5px; font-weight:800; }
  .rstat{ font-size:8.5px; color:var(--muted); margin-top:1px; }

  /* ---- winner banner ---- */
  #winnerBanner{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    z-index:8; opacity:0; pointer-events:none; transition:opacity .35s ease; background:radial-gradient(ellipse at center, rgba(0,0,0,.55), rgba(0,0,0,.15)); }
  #winnerBanner.show{ opacity:1; }
  #winnerBanner .tag{ font-size:12px; letter-spacing:.25em; text-transform:uppercase; color:var(--accent2); font-weight:800; }
  #winnerBanner .wname{ font-size:15vw; font-weight:900; line-height:1; margin-top:6px; text-shadow:0 6px 24px rgba(0,0,0,.7); }
  #stage.aspect-h #winnerBanner .wname{ font-size:8vw; }

  /* ---- standings ---- */
  #leaderboardPanel{ position:absolute; left:10px; right:10px; top:110px; bottom:110px; z-index:6;
    background:rgba(10,14,24,.92); border:1px solid rgba(255,255,255,.08); border-radius:14px;
    padding:14px; opacity:0; transform:translateY(16px); pointer-events:none;
    transition:opacity .4s ease, transform .4s ease; overflow:auto; }
  #leaderboardPanel.show{ opacity:1; transform:translateY(0); }
  #leaderboardPanel h3{ font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); margin-bottom:10px; }
  .lbrow{ display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid rgba(255,255,255,.06); font-size:13px; }
  .lbrank{ width:20px; color:var(--muted); font-weight:800; }
  .lbswatch{ width:12px; height:12px; border-radius:50%; }
  .lbname{ flex:1; font-weight:700; }
  .lbwins{ color:var(--accent); font-weight:800; }

  /* ---- settings ---- */
  #settingsToggle{ position:fixed; top:16px; right:16px; z-index:20; width:38px; height:38px; border-radius:50%;
    background:var(--panel); border:1px solid rgba(255,255,255,.15); color:var(--text); font-size:17px; cursor:pointer; }
  #settingsPanel{ position:fixed; top:0; right:-320px; width:300px; height:100%; background:#0c1120; z-index:19;
    border-left:1px solid rgba(255,255,255,.08); padding:66px 18px 18px; overflow-y:auto; transition:right .3s ease; }
  #settingsPanel.open{ right:0; }
  #settingsPanel h4{ font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin:16px 0 6px; }
  #settingsPanel h4:first-child{ margin-top:0; }
  #settingsPanel label{ font-size:13px; display:block; margin-bottom:4px; }
  #settingsPanel select, #settingsPanel input[type=range]{ width:100%; margin-bottom:8px; }
  .rowbtn{ display:flex; gap:8px; margin-bottom:8px; }
  .rowbtn button{ flex:1; padding:8px; border-radius:8px; border:1px solid rgba(255,255,255,.15);
    background:#161d30; color:var(--text); font-size:12px; cursor:pointer; }
  .rowbtn button.active{ background:var(--accent); color:#1a1204; border-color:var(--accent); font-weight:800; }
  #skipBtn, #resetBtn{ width:100%; padding:10px; border-radius:8px; border:none; font-weight:800; cursor:pointer; margin-top:6px; }
  #skipBtn{ background:var(--accent2); color:#03212a; }
  #resetBtn{ background:transparent; border:1px solid var(--crimson); color:var(--crimson); }
  .toggleRow{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; font-size:13px; }
  .toggleRow input{ width:36px; height:20px; }
  #rangeVal{ float:right; color:var(--accent); }
</style>
</head>
<body>
<div id="app">
  <div id="stage" class="aspect-v">
    <canvas id="track"></canvas>
    <canvas id="fx"></canvas>

    <div id="brandRow"><div id="liveDot"></div><div id="brand">NOW JUST RELAX <span>•</span> RACE NIGHT</div></div>
    <div id="stageCountdown">--</div>
    <div id="ticker"><div id="tickerTrack"></div></div>
    <div id="phaseLabel"></div>
    <div id="commentary"></div>

    <div id="bottomStack">
      <div id="tensionWrap">
        <div id="tensionMeter"><div id="tensionFill"></div></div>
        <div id="tensionCaption"></div>
      </div>
      <div id="roster"></div>
    </div>
    <div id="leaderboardPanel"><h3>Session Standings</h3><div id="lbBody"></div></div>
    <div id="winnerBanner"><div class="tag">Winner</div><div class="wname" id="wname"></div></div>
  </div>
</div>

<button id="settingsToggle">⚙</button>
<div id="settingsPanel">
  <h4>Pace</h4>
  <div class="rowbtn" id="paceRow">
    <button data-v="0.65">Blitz</button>
    <button data-v="1" class="active">Standard</button>
    <button data-v="1.4">Marathon</button>
  </div>

  <h4>Track Theme</h4>
  <select id="themeSel">
    <option value="midnight">Midnight Circuit</option>
    <option value="neon">Neon Grid</option>
    <option value="desert">Desert Dust</option>
    <option value="forest">Forest Trail</option>
  </select>

  <h4>Aspect Ratio</h4>
  <div class="rowbtn" id="aspectRow">
    <button data-v="v" class="active">Vertical 9:16</button>
    <button data-v="h">Widescreen 16:9</button>
  </div>

  <h4>Racers Per Race<span id="rangeVal">6</span></h4>
  <input type="range" id="racerCount" min="4" max="8" value="6" step="1">

  <h4>Audio</h4>
  <div class="toggleRow"><label for="musicToggle">Ambient Music</label><input type="checkbox" id="musicToggle" checked></div>
  <div class="toggleRow"><label for="sfxToggle">Sound Effects</label><input type="checkbox" id="sfxToggle" checked></div>

  <h4>Broadcast Controls</h4>
  <button id="skipBtn">Skip to Next Phase</button>
  <button id="resetBtn">Reset Leaderboard</button>
</div>

<script>
(() => {
'use strict';

/* ============ THEMES ============ */
const THEMES = {
  midnight:{ bgTop:'#111a2e', bgBot:'#0a0e18', lane:'#232a3b', laneLine:'#3a4257', accent:'#FFB627', accent2:'#2EC4E8', pad:130 },
  neon:{ bgTop:'#170a2e', bgBot:'#0a0616', lane:'#241640', laneLine:'#3d2566', accent:'#FF2E9E', accent2:'#2EC4E8', pad:180 },
  desert:{ bgTop:'#2a1a0c', bgBot:'#160d05', lane:'#4a3420', laneLine:'#6b4d2e', accent:'#FF9F43', accent2:'#FFD93D', pad:98 },
  forest:{ bgTop:'#0f2318', bgBot:'#08130d', lane:'#234232', laneLine:'#356248', accent:'#6BCB77', accent2:'#FFD93D', pad:110 }
};
let theme = THEMES.midnight;

/* ============ RACER POOL ============ */
const NAME_POOL = ['Blaze','Nova','Ricochet','Comet','Static','Marbles','Glimmer','Turbo','Zephyr','Ember','Vortex','Pixel','Rumble','Echo','Sable','Quill'];
const COLOR_POOL = ['#FF6B6B','#4ECDC4','#FFD93D','#6C5CE7','#FF9F43','#1DD1A1','#54A0FF','#FF6B9D','#A29BFE','#FDCB6E','#00D2D3','#FF7675','#74B9FF','#55EFC4','#E17055','#81ECEC'];
const winCounts = {};
NAME_POOL.forEach(n=>winCounts[n]=0);

function shuffled(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function rand(a,b){ return a+Math.random()*(b-a); }
function lerp(a,b,t){ return a+(b-a)*t; }

/* ============ AUDIO ENGINE (procedural, no external assets) ============ */
let audioCtx = null, masterGain, musicGain, sfxGain;
let musicOn = true, sfxOn = true;
let padNodes = null;

function ensureAudio(){
  if(audioCtx){
    if(audioCtx.state === 'suspended') audioCtx.resume();
    return;
  }
  audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state === 'suspended') audioCtx.resume();
  masterGain = audioCtx.createGain(); masterGain.gain.value = 0.9; masterGain.connect(audioCtx.destination);
  musicGain = audioCtx.createGain(); musicGain.gain.value = 0.25; musicGain.connect(masterGain);
  sfxGain = audioCtx.createGain(); sfxGain.gain.value = 0.5; sfxGain.connect(masterGain);
}

function startPad(){
  if(!audioCtx || !musicOn) return;
  stopPad();
  const t = audioCtx.currentTime;
  const base = theme.pad;
  const oscs = [1, 1.5, 2.01].map((mult,i)=>{
    const o = audioCtx.createOscillator();
    o.type = i===2 ? 'sine':'triangle';
    o.frequency.value = base*mult;
    const g = audioCtx.createGain(); g.gain.value = 0;
    o.connect(g); g.connect(musicGain);
    o.start(t);
    g.gain.linearRampToValueAtTime(i===0?0.5:0.22, t+1.2);
    return {o,g};
  });
  const lfo = audioCtx.createOscillator(); lfo.frequency.value = 0.08;
  const lfoGain = audioCtx.createGain(); lfoGain.gain.value = base*0.02;
  lfo.connect(lfoGain); lfoGain.connect(oscs[0].o.frequency); lfo.start(t);
  padNodes = {oscs, lfo};
}
function stopPad(){
  if(!padNodes) return;
  const t = audioCtx.currentTime;
  padNodes.oscs.forEach(({o,g})=>{ g.gain.linearRampToValueAtTime(0, t+0.4); o.stop(t+0.5); });
  padNodes.lfo.stop(t+0.5);
  padNodes = null;
}

function playTick(){
  if(!audioCtx || !sfxOn) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator(); o.type='square'; o.frequency.value=880;
  const g = audioCtx.createGain(); g.gain.value=0.15;
  o.connect(g); g.connect(sfxGain);
  g.gain.setValueAtTime(0.15,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.09);
  o.start(t); o.stop(t+0.1);
}
function playKlaxon(){
  if(!audioCtx || !sfxOn) return;
  const t = audioCtx.currentTime;
  [0,0.18,0.36].forEach(off=>{
    const o = audioCtx.createOscillator(); o.type='sawtooth'; o.frequency.value=220;
    const g = audioCtx.createGain(); g.gain.value=0.001;
    o.connect(g); g.connect(sfxGain);
    g.gain.setValueAtTime(0.001, t+off); g.gain.exponentialRampToValueAtTime(0.35, t+off+0.03);
    g.gain.exponentialRampToValueAtTime(0.001, t+off+0.16);
    o.start(t+off); o.stop(t+off+0.18);
  });
}
function playBoost(){
  if(!audioCtx || !sfxOn) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator(); o.type='sawtooth';
  o.frequency.setValueAtTime(200,t); o.frequency.exponentialRampToValueAtTime(700,t+0.25);
  const g = audioCtx.createGain(); g.gain.value=0.001;
  o.connect(g); g.connect(sfxGain);
  g.gain.setValueAtTime(0.001,t); g.gain.exponentialRampToValueAtTime(0.22,t+0.05);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.3);
  o.start(t); o.stop(t+0.32);
}
function playLap(){
  if(!audioCtx || !sfxOn) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator(); o.type='triangle'; o.frequency.value=660;
  const g = audioCtx.createGain(); g.gain.value=0.001;
  o.connect(g); g.connect(sfxGain);
  g.gain.setValueAtTime(0.001,t); g.gain.exponentialRampToValueAtTime(0.2,t+0.02);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.25);
  o.start(t); o.stop(t+0.27);
}
function playCheer(){
  if(!audioCtx || !sfxOn) return;
  const t = audioCtx.currentTime;
  const bufSize = audioCtx.sampleRate*1.4;
  const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<bufSize;i++) data[i] = (Math.random()*2-1) * (1-i/bufSize);
  const noise = audioCtx.createBufferSource(); noise.buffer = buf;
  const filt = audioCtx.createBiquadFilter(); filt.type='bandpass'; filt.frequency.value=1400; filt.Q.value=0.6;
  const g = audioCtx.createGain(); g.gain.value=0.001;
  noise.connect(filt); filt.connect(g); g.connect(sfxGain);
  g.gain.setValueAtTime(0.001,t); g.gain.linearRampToValueAtTime(0.35,t+0.15); g.gain.linearRampToValueAtTime(0.001,t+1.4);
  noise.start(t); noise.stop(t+1.45);
  [523,659,784].forEach((f,i)=>{
    const o = audioCtx.createOscillator(); o.type='triangle'; o.frequency.value=f;
    const og = audioCtx.createGain(); og.gain.value=0.001;
    o.connect(og); og.connect(sfxGain);
    og.gain.setValueAtTime(0.001,t+i*0.06); og.gain.exponentialRampToValueAtTime(0.18,t+i*0.06+0.05);
    og.gain.exponentialRampToValueAtTime(0.001,t+i*0.06+0.5);
    o.start(t+i*0.06); o.stop(t+i*0.06+0.55);
  });
}

/* ============ CANVAS / TRACK ============ */
const stage = document.getElementById('stage');
const trackCanvas = document.getElementById('track');
const fxCanvas = document.getElementById('fx');
const tctx = trackCanvas.getContext('2d');
const fctx = fxCanvas.getContext('2d');

let LOGICAL_W = 480, LOGICAL_H = 852;
function setCanvasSize(){
  const isV = stage.classList.contains('aspect-v');
  LOGICAL_W = isV ? 480 : 852;
  LOGICAL_H = isV ? 852 : 480;
  [trackCanvas, fxCanvas].forEach(c=>{ c.width = LOGICAL_W; c.height = LOGICAL_H; });
}

let trackPoints = [], cumLens = [], totalLen = 0;
function generateTrack(){
  const cx = LOGICAL_W/2, cy = LOGICAL_H*0.46;
  const baseRx = LOGICAL_W*0.36, baseRy = LOGICAL_H*0.30;
  const harmonics = [
    {amp:rand(0.03,0.10), freq:2+Math.floor(rand(0,2)), phase:rand(0,Math.PI*2)},
    {amp:rand(0.02,0.07), freq:3+Math.floor(rand(0,3)), phase:rand(0,Math.PI*2)}
  ];
  const N = 240;
  trackPoints = [];
  for(let i=0;i<=N;i++){
    const a = (i/N)*Math.PI*2;
    let r = 1;
    harmonics.forEach(h=> r += h.amp*Math.sin(h.freq*a+h.phase));
    trackPoints.push({ x: cx+Math.cos(a)*baseRx*r, y: cy+Math.sin(a)*baseRy*r });
  }
  cumLens = [0];
  totalLen = 0;
  for(let i=1;i<trackPoints.length;i++){
    const dx = trackPoints[i].x-trackPoints[i-1].x, dy = trackPoints[i].y-trackPoints[i-1].y;
    totalLen += Math.hypot(dx,dy);
    cumLens.push(totalLen);
  }
}

function pointAtProgress(p){
  p = Math.max(0, Math.min(0.999, p));
  const target = p*totalLen;
  let lo=0, hi=cumLens.length-1;
  while(lo<hi){ const mid=(lo+hi)>>1; if(cumLens[mid]<target) lo=mid+1; else hi=mid; }
  const i = Math.max(1, lo);
  const segLen = cumLens[i]-cumLens[i-1] || 1;
  const t = (target-cumLens[i-1])/segLen;
  const p0 = trackPoints[i-1], p1 = trackPoints[i];
  return { x: lerp(p0.x,p1.x,t), y: lerp(p0.y,p1.y,t), heading: Math.atan2(p1.y-p0.y, p1.x-p0.x) };
}

/* ============ RACERS ============ */
const LAPS = 3;
let racers = [];
let finishCounter = 0;
let lastAnnouncedLap = 0;
function buildRacers(count){
  const names = shuffled(NAME_POOL).slice(0,count);
  racers = names.map((name,i)=>{
    const color = COLOR_POOL[NAME_POOL.indexOf(name)];
    return {
      name, color,
      speedStat: rand(0.9,1.1),
      luckStat: rand(0.6,1.4),
      progress: 0,
      speedFactor: 1,
      targetSpeedFactor: 1,
      boostUntil: 0,
      nextWobble: 0,
      finished: false,
      finishOrder: 0,
      lastLap: 0
    };
  });
}
function ordinal(n){
  const s = ['th','st','nd','rd'], v = n%100;
  return n + (s[(v-20)%10] || s[v] || s[0]);
}

/* ============ STATE MACHINE ============ */
const PHASES = ['lineup','betting','lockin','race','finish','reveal','standings'];
const BASE_DUR = { lineup:6, betting:12, lockin:2, race:28, finish:4, reveal:6, standings:6 };
const PHASE_LABELS = { lineup:'LINEUP', betting:'GUESSING', lockin:'LOCKED IN', race:'RACE', finish:'PHOTO FINISH', reveal:'WINNER', standings:'STANDINGS' };
let currentLeaderLap = 1;
let paceMult = 1;
let phaseIndex = 0;
let phaseStart = 0;
let lastTickSecond = -1;
let lastLeader = null;
let nextBoostTime = 0;
let nextCommentaryTime = 0;
let timeScale = 1;

function dur(phase){ return BASE_DUR[phase]*paceMult; }

const commentaryLines = [
  n=>`It's a tight pack out there!`,
  n=>`${n} is finding a rhythm!`,
  n=>`Anyone's race right now!`,
  n=>`${n} digging in through the turn!`,
  n=>`The gap is closing fast!`,
  n=>`${n} refuses to back off!`
];

function setCommentary(text){
  const el = document.getElementById('commentary');
  el.style.opacity = 0;
  setTimeout(()=>{ el.textContent = text; el.style.opacity = 1; }, 150);
}

function pickTickerLines(){
  const favorite = racers.slice().sort((a,b)=>(winCounts[b.name]-winCounts[a.name]))[0];
  const lines = [
    `💬 Drop your guess in the comments!`,
    `🔥 ${favorite ? favorite.name : ''} leads the season standings`,
    `👀 New track just dropped — anyone's game`,
    `🏁 Six racers, one lap, no mercy`,
    `📈 Odds tighten every turn — stay locked in`
  ];
  document.getElementById('tickerTrack').textContent = lines.join('   •   ');
}

function enterPhase(phase){
  phaseStart = performance.now()/1000;
  lastTickSecond = -1;
  document.getElementById('phaseLabel').textContent = PHASE_LABELS[phase] || phase.toUpperCase();
  const tensionFill = document.getElementById('tensionFill');
  const wBanner = document.getElementById('winnerBanner');
  const lbPanel = document.getElementById('leaderboardPanel');

  if(phase==='lineup'){
    generateTrack();
    const count = parseInt(document.getElementById('racerCount').value,10);
    buildRacers(count);
    lastLeader = null;
    wBanner.classList.remove('show');
    lbPanel.classList.remove('show');
    tensionFill.classList.remove('locked');
    tensionFill.style.width='0%';
    document.getElementById('tensionCaption').textContent = 'Lineup locking in...';
    renderRoster(true);
    pickTickerLines();
    setCommentary(`Tonight's field is set — good luck!`);
    startPad();
  }
  if(phase==='betting'){
    document.getElementById('tensionCaption').textContent = 'Make your guess — drop it in the comments!';
    setCommentary(`Guessing is open — who's taking this one?`);
  }
  if(phase==='lockin'){
    tensionFill.classList.add('locked');
    tensionFill.style.width='100%';
    document.getElementById('tensionCaption').textContent = 'GUESSES LOCKED';
    stage.classList.add('punch');
    setTimeout(()=>stage.classList.remove('punch'), 320);
    playKlaxon();
    setCommentary(`Guesses locked! Here we go!`);
  }
  if(phase==='race'){
    nextBoostTime = rand(3,5);
    nextCommentaryTime = rand(3,5);
    timeScale = 1;
    finishCounter = 0;
    lastAnnouncedLap = 0;
    racers.forEach(r=>{ r.finished=false; r.finishOrder=0; r.lastLap=0; });
    setCommentary(`Three laps — they're off!`);
  }
  if(phase==='finish'){
    timeScale = 0.32;
    setCommentary(`Photo finish!`);
  }
  if(phase==='reveal'){
    const finishers = racers.filter(r=>r.finished).sort((a,b)=>a.finishOrder-b.finishOrder);
    const winner = finishers[0] || racers.slice().sort((a,b)=>b.progress-a.progress)[0];
    winCounts[winner.name] = (winCounts[winner.name]||0)+1;
    document.getElementById('wname').textContent = winner.name;
    document.getElementById('wname').style.color = winner.color;
    wBanner.classList.add('show');
    spawnConfetti(winner.color);
    playCheer();
    setCommentary(`${winner.name} takes the win!`);
  }
  if(phase==='standings'){
    wBanner.classList.remove('show');
    renderLeaderboard();
    lbPanel.classList.add('show');
    setCommentary(`Next race coming right up...`);
  }
}

function advancePhase(){
  phaseIndex = (phaseIndex+1)%PHASES.length;
  enterPhase(PHASES[phaseIndex]);
}

/* ============ ROSTER / LEADERBOARD UI ============ */
function renderRoster(animate){
  const el = document.getElementById('roster');
  el.innerHTML = '';
  racers.forEach((r,i)=>{
    const card = document.createElement('div');
    card.className = 'rcard';
    card.innerHTML = `<div class="rswatch" style="background:${r.color}"></div>
      <div class="rname">${r.name}</div>
      <div class="rstat">SPD ${(r.speedStat*100).toFixed(0)} • LCK ${(r.luckStat*100).toFixed(0)}</div>`;
    el.appendChild(card);
    if(animate) setTimeout(()=>card.classList.add('show'), 120*i);
    else card.classList.add('show');
  });
}
function renderLeaderboard(){
  const body = document.getElementById('lbBody');
  const sorted = Object.entries(winCounts).sort((a,b)=>b[1]-a[1]).filter(([,w])=>w>0).slice(0,10);
  if(sorted.length===0){ body.innerHTML = `<div style="color:var(--muted); font-size:13px;">No wins recorded yet — first race sets the board!</div>`; return; }
  body.innerHTML = sorted.map(([name,wins],i)=>{
    const color = COLOR_POOL[NAME_POOL.indexOf(name)];
    return `<div class="lbrow"><div class="lbrank">#${i+1}</div><div class="lbswatch" style="background:${color}"></div>
      <div class="lbname">${name}</div><div class="lbwins">${wins} win${wins===1?'':'s'}</div></div>`;
  }).join('');
}

/* ============ CONFETTI ============ */
let confetti = [];
function spawnConfetti(color){
  confetti = [];
  const colors = [color, theme.accent, theme.accent2, '#ffffff'];
  for(let i=0;i<90;i++){
    confetti.push({
      x: LOGICAL_W/2 + rand(-20,20), y: LOGICAL_H*0.35,
      vx: rand(-2.6,2.6), vy: rand(-5,-1.5),
      g: rand(0.08,0.16), size: rand(3,7),
      color: colors[Math.floor(Math.random()*colors.length)],
      rot: rand(0,Math.PI*2), vr: rand(-0.2,0.2), life: 1
    });
  }
}
function updateDrawConfetti(){
  fctx.clearRect(0,0,LOGICAL_W,LOGICAL_H);
  confetti.forEach(p=>{
    p.vy += p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life -= 0.006;
    if(p.life<=0) return;
    fctx.save();
    fctx.translate(p.x,p.y); fctx.rotate(p.rot); fctx.globalAlpha = Math.max(0,p.life);
    fctx.fillStyle = p.color;
    fctx.fillRect(-p.size/2,-p.size/2,p.size,p.size);
    fctx.restore();
  });
  confetti = confetti.filter(p=>p.life>0 && p.y<LOGICAL_H+40);
}

/* ============ RACE SIM ============ */
function updateRace(elapsed, dTime, dSec){
  const raceDur = dur('race');
  const remaining = raceDur - elapsed;

  if(elapsed >= nextBoostTime){
    const weights = racers.map(r=>r.luckStat);
    const total = weights.reduce((a,b)=>a+b,0);
    let roll = Math.random()*total, chosen = racers[0];
    for(let i=0;i<racers.length;i++){ roll -= weights[i]; if(roll<=0){ chosen = racers[i]; break; } }
    chosen.boostUntil = elapsed + 1.2;
    playBoost();
    setCommentary(`${chosen.name} hits a boost and surges ahead!`);
    nextBoostTime = elapsed + rand(4,6.5);
  }

  racers.forEach(r=>{
    if(r.finished) return;
    if(elapsed >= r.nextWobble){
      r.targetSpeedFactor = rand(0.82,1.18);
      r.nextWobble = elapsed + rand(0.6,1.3);
    }
    r.speedFactor = lerp(r.speedFactor, r.targetSpeedFactor, 0.06);
    let mult = r.speedFactor * r.speedStat;
    if(elapsed < r.boostUntil) mult *= 1.55;
    r.progress += (dSec*timeScale) * (1/raceDur) * mult;

    if(r.progress >= 1){
      r.progress = 1;
      r.finished = true;
      finishCounter += 1;
      r.finishOrder = finishCounter;
      playLap();
      setCommentary(`${r.name} crosses the line in ${ordinal(r.finishOrder)}!`);
    } else {
      const lapNow = Math.min(LAPS, Math.floor(r.progress*LAPS));
      if(lapNow > r.lastLap){
        r.lastLap = lapNow;
        if(lapNow > lastAnnouncedLap){
          lastAnnouncedLap = lapNow;
          playLap();
          setCommentary(`Lap ${lapNow+1} of ${LAPS}!`);
        }
      }
    }
  });

  if(remaining < raceDur*0.3){
    const active = racers.filter(r=>!r.finished);
    const leaderP = Math.max(...racers.map(r=>r.progress));
    active.forEach(r=>{
      const gap = leaderP - r.progress;
      if(gap>0.01) r.progress += gap*0.02*(dSec*timeScale)*4;
    });
  }

  const leader = racers.slice().sort((a,b)=> (b.finished?1:0)-(a.finished?1:0) || b.progress-a.progress)[0];
  if(leader && lastLeader && leader.name!==lastLeader && !leader.finished){
    setCommentary(`${leader.name} takes the lead!`);
  }
  lastLeader = leader ? leader.name : lastLeader;
  const leaderP = leader ? leader.progress : 0;
  currentLeaderLap = Math.min(LAPS, Math.floor(leaderP*LAPS)+1);

  if(elapsed >= nextCommentaryTime){
    const line = commentaryLines[Math.floor(Math.random()*commentaryLines.length)];
    setCommentary(line(leader ? leader.name : ''));
    nextCommentaryTime = elapsed + rand(3.5,5.5);
  }
}

/* ============ RENDER ============ */
function drawTrack(){
  tctx.clearRect(0,0,LOGICAL_W,LOGICAL_H);
  const g = tctx.createLinearGradient(0,0,0,LOGICAL_H);
  g.addColorStop(0, theme.bgTop); g.addColorStop(1, theme.bgBot);
  tctx.fillStyle = g; tctx.fillRect(0,0,LOGICAL_W,LOGICAL_H);

  if(trackPoints.length===0) return;
  tctx.lineWidth = 46; tctx.strokeStyle = theme.lane; tctx.lineJoin='round'; tctx.lineCap='round';
  tctx.beginPath();
  trackPoints.forEach((p,i)=> i===0?tctx.moveTo(p.x,p.y):tctx.lineTo(p.x,p.y));
  tctx.closePath(); tctx.stroke();

  tctx.lineWidth = 2; tctx.strokeStyle = theme.laneLine; tctx.setLineDash([10,10]);
  tctx.beginPath();
  trackPoints.forEach((p,i)=> i===0?tctx.moveTo(p.x,p.y):tctx.lineTo(p.x,p.y));
  tctx.closePath(); tctx.stroke();
  tctx.setLineDash([]);

  const start = trackPoints[0];
  tctx.save();
  tctx.translate(start.x, start.y);
  for(let i=0;i<6;i++){
    tctx.fillStyle = i%2===0 ? '#fff':'#111';
    tctx.fillRect(-3+i*3-9, -23, 3, 46);
  }
  tctx.restore();

  const sorted = racers.slice().sort((a,b)=>a.progress-b.progress);
  sorted.forEach(r=>{
    const lapPos = (r.progress*LAPS) % 1;
    const pt = pointAtProgress(lapPos);
    tctx.save();
    tctx.translate(pt.x, pt.y);
    tctx.rotate(pt.heading);
    tctx.fillStyle = r.color;
    tctx.beginPath();
    tctx.roundRect ? tctx.roundRect(-11,-6,22,12,6) : tctx.rect(-11,-6,22,12);
    tctx.fill();
    tctx.fillStyle = '#05070c';
    tctx.beginPath(); tctx.arc(8,0,2.4,0,Math.PI*2); tctx.fill();
    tctx.restore();

    tctx.font = '700 11px "Helvetica Neue", Arial, sans-serif';
    tctx.textAlign = 'center';
    tctx.fillStyle = '#fff';
    tctx.strokeStyle = 'rgba(0,0,0,.6)'; tctx.lineWidth = 3;
    tctx.strokeText(r.name, pt.x, pt.y-14);
    tctx.fillText(r.name, pt.x, pt.y-14);
  });
}

function updateTensionBar(phase, elapsed, d){
  const fill = document.getElementById('tensionFill');
  const wrap = document.getElementById('tensionMeter');
  if(phase==='betting'){
    fill.style.width = `${(elapsed/d)*100}%`;
    const remaining = Math.ceil(d-elapsed);
    if(remaining<=5 && remaining!==lastTickSecond && remaining>0){ playTick(); lastTickSecond = remaining; }
    document.getElementById('tensionCaption').textContent = `Guessing closes in ${Math.max(0,remaining)}s`;
  }
  if(phase==='race'){
    Array.from(wrap.querySelectorAll('.posDot')).forEach(n=>n.remove());
    racers.forEach(r=>{
      const dot = document.createElement('div');
      dot.className = 'posDot';
      dot.style.left = `${Math.min(100,r.progress*100)}%`;
      dot.style.background = r.color;
      wrap.appendChild(dot);
    });
    fill.style.width = '0%';
    document.getElementById('tensionCaption').textContent = 'Live positions';
  }
  if(phase==='lineup'){
    fill.style.width = `${(elapsed/d)*100}%`;
    fill.classList.remove('locked');
  }
}

/* ============ MAIN LOOP ============ */
let lastFrameT = null;
function loop(now){
  requestAnimationFrame(loop);
  const t = now/1000;
  if(lastFrameT===null) lastFrameT = t;
  const dSec = Math.min(0.05, t-lastFrameT);
  lastFrameT = t;

  const phase = PHASES[phaseIndex];
  const elapsed = t - phaseStart;
  const d = dur(phase);

  if(phase==='race') updateRace(elapsed, d, dSec);
  updateTensionBar(phase, elapsed, d);
  if(phase==='race'){
    setStageBadge(`LAP ${currentLeaderLap}/${LAPS}`, false);
  } else {
    const secs = Math.max(0, Math.ceil(d-elapsed));
    setStageBadge(secs+'s', secs<=3);
  }
  drawTrack();
  updateDrawConfetti();

  let phaseDone = elapsed >= d;
  if(phase==='race'){
    phaseDone = finishCounter >= 1 || elapsed >= d*2.5; // safety cap if nobody finishes
  }
  if(phaseDone) advancePhase();
}

function setStageBadge(text, warn){
  const el = document.getElementById('stageCountdown');
  if(!el) return;
  if(el.textContent !== text) el.textContent = text;
  el.classList.toggle('warn', !!warn);
}

/* ============ SETTINGS WIRING ============ */
function applyTheme(name){
  theme = THEMES[name];
  document.documentElement.style.setProperty('--lane', theme.lane);
  document.documentElement.style.setProperty('--lane-line', theme.laneLine);
  document.documentElement.style.setProperty('--accent', theme.accent);
  document.documentElement.style.setProperty('--accent2', theme.accent2);
  if(padNodes) startPad();
}

document.getElementById('settingsToggle').addEventListener('click', ()=>{
  document.getElementById('settingsPanel').classList.toggle('open');
});

document.querySelectorAll('#paceRow button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('#paceRow button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    paceMult = parseFloat(btn.dataset.v);
  });
});

document.querySelectorAll('#aspectRow button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('#aspectRow button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    stage.classList.toggle('aspect-v', btn.dataset.v==='v');
    stage.classList.toggle('aspect-h', btn.dataset.v==='h');
    setCanvasSize();
    generateTrack();
  });
});

document.getElementById('themeSel').addEventListener('change', e=> applyTheme(e.target.value));

document.getElementById('racerCount').addEventListener('input', e=>{
  document.getElementById('rangeVal').textContent = e.target.value;
});

document.getElementById('musicToggle').addEventListener('change', e=>{
  musicOn = e.target.checked;
  if(musicOn) startPad(); else stopPad();
});
document.getElementById('sfxToggle').addEventListener('change', e=> sfxOn = e.target.checked);

document.getElementById('skipBtn').addEventListener('click', ()=> advancePhase());
document.getElementById('resetBtn').addEventListener('click', ()=>{
  NAME_POOL.forEach(n=>winCounts[n]=0);
  renderLeaderboard();
});

window.addEventListener('resize', ()=>{ setCanvasSize(); });
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden && audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
});

/* ============ BOOT ============ */
let started = false;
function start(){
  if(started) return;
  started = true;
  ensureAudio();
  setCanvasSize();
  generateTrack();
  phaseIndex = 0;
  enterPhase('lineup');
  requestAnimationFrame(loop);
  document.removeEventListener('click', start);
  document.removeEventListener('touchstart', start);
}
document.addEventListener('click', start, {once:true});
document.addEventListener('touchstart', start, {once:true});

// Fallback: also render a static first frame before first interaction (audio needs a gesture)
setCanvasSize();
generateTrack();
buildRacers(6);
drawTrack();
document.getElementById('phaseLabel').textContent = 'TAP TO START';
document.getElementById('commentary').textContent = 'Tap anywhere to start Race Night Live';

})();
</script>
